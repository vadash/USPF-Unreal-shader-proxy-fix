name: build
on:
  workflow_dispatch:
  push:
    branches: [ci]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64 cross toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++-mingw-w64-x86-64

      - name: Build d3d12.dll proxy
        run: |
          mkdir -p work
          cp -r source/d3d12async work/d3d12async
          cp -r source work/source
          cd work/d3d12async && bash build.sh

      - name: Build USPF.exe (embeds the proxy)
        run: cd work/source && bash build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: USPF-build
          path: |
            work/source/build/USPF.exe
            work/d3d12async/build/d3d12.dll
            work/source/payload/d3d12async.ini
          if-no-files-found: error

      - name: Publish to rolling "ci-build" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd work
          gh release delete ci-build --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create ci-build --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "USPF — rebuilt from source (GitHub Actions)" \
            --notes "Automated MinGW-w64 rebuild of commit $GITHUB_SHA from $GITHUB_REPOSITORY.
          Built with the project's own build.sh on ubuntu-latest. Binaries are unsigned.
          USPF.exe embeds d3d12.dll, d3d12async.ini and the WebView2 loader; the loose files are for manual installs next to a game exe." \
            source/build/USPF.exe d3d12async/build/d3d12.dll source/payload/d3d12async.ini
