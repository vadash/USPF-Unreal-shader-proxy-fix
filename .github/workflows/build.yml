name: build
on:
  workflow_dispatch:
  push:
    branches: [ci]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64 cross toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++-mingw-w64-x86-64

      - name: Build d3d12.dll proxy
        working-directory: source/d3d12async
        run: ./build.sh

      - name: Build USPF.exe (embeds the proxy)
        working-directory: source
        run: ./build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: USPF-build
          path: |
            source/build/USPF.exe
            source/d3d12async/build/d3d12.dll
            source/d3d12async/d3d12async.ini
          if-no-files-found: error
